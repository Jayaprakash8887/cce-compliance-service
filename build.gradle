plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'org.openphc.cce'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    johnzonVersion = '2.0.2'
    hapiVersion = '7.6.0'
}

dependencies {
    // Shared vocabulary, Kafka contracts and FHIR parsing/evaluation.
    implementation 'org.openphc.cce:cce-common-util'

    // Spring Boot starters.
    // starter-web serves the intelligence-event read endpoint plus actuator's /actuator/health
    // (container HEALTHCHECK and Kubernetes probes) and /actuator/prometheus.
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.kafka:spring-kafka'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // FHIR
    implementation "ca.uhn.hapi.fhir:hapi-fhir-base:${hapiVersion}"
    implementation "ca.uhn.hapi.fhir:hapi-fhir-structures-r4:${hapiVersion}"
    // Neither of the next two is referenced from source, but both are required at runtime — do not
    // remove as "unused". FhirContext needs a hapi-fhir-caching-* module for its internal caches,
    // and HAPI's FHIRPath engine loads org.fhir.ucum classes eagerly (NoClassDefFoundError without).
    implementation "ca.uhn.hapi.fhir:hapi-fhir-caching-caffeine:${hapiVersion}"
    implementation 'org.fhir:ucum:1.0.8'

    // Expression evaluation
    implementation "org.apache.johnzon:johnzon-jsonlogic:${johnzonVersion}"
    implementation "org.apache.johnzon:johnzon-core:${johnzonVersion}"
    implementation 'jakarta.json:jakarta.json-api:2.1.3'

    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

}

tasks.named('test') {
    useJUnitPlatform()
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Enforced at 98%: the only uncovered code is the application's main() bootstrap, which is excluded
// below. Raise nothing here without adding the tests first — the ratchet is the point.
jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            // Spring Boot's entry point: covering it means starting the whole context, which the
            // integration suite does far better than a unit test asserting main() ran.
            excludes = ['org.openphc.cce.compliance.ComplianceServiceApplication']
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}
